common:
  img_topic: "/img0/image_raw"
  lid_topic: "/points_raw"
#  lid_topic: "/fast_livo/cpp/centerpp_node/pointcloud_static"
  imu_topic: "/imu_raw"
  gnss_topic:  "/gps/fix"
  img_en: 1
  lidar_en: 1
  ros_driver_bug_fix: false
  imuAngularIsDegree: true
  isPengyudata: true

extrin_calib:
   #2020/10/27 and 2020/10/29 WHU-DATASET
    extrinsic_T: [ 6.8390199999999998e-02,  -5.0610000000000004e-03, -4.6948099999999998e-01]
    extrinsic_R: [ 0.999890000000000,-0.0126633000000000,0.00378010000000000,
                   0.0142885000000000,0.999792000000000,0.0160484000000000,
                   -0.00398528000000000,-0.0159993000000000,0.999864000000000]
    #left camera
    Rcl: [0.0174098903859430,-0.999841673901088,0.000135494463077818,
      0.00108829720368383,-0.000111963410751705,-0.999999021113712,
      0.999826162409258,0.0190975028446728,0.00109276908146143]
    Pcl: [0.145911738634105,-0.418790670536257,-0.265383389977634]

    extrinT_Gnss2Lidar: [0, 0, 0]
    extrinR_Gnss2Lidar: [0,  1, 0,
                         1,  0, 0,
                         0,  0, -1]

time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 5
  filter_size_surf: 0.2
  lidar_type: 2
  scan_line: 16
  blind: 1.5

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: false
  inv_expo_cov: 0.1
  semidense_en: true
  huber_delta: 15.0
  depth_max_m: 30.0
  depth_ref_m: 10.0
  max_points_cap: 2000

imu:
  imu_en: true
  imu_int_frame: 30
  acc_cov: 0.1 # 0.2
  gyr_cov: 0.1 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

#CAMPUS1
lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.02
  min_eigen_value: 0.07 # 0.005
  voxel_size: 2.0
  max_layer: 2
  max_points_num: 100
  layer_init_num: [5, 5, 5, 5, 5]
  Degeneracy_mitigation: false
  Degeneracy_Trans_thres: 25
  Degeneracy_Rot_thres: 25

  #CAMPUS2
#lio:
#  max_iterations: 5
#  dept_err: 0.02
#  beam_err: 0.02
#  min_eigen_value: 0.05 # 0.005
#  voxel_size: 2.0
#  max_layer: 2
#  max_points_num: 100
#  layer_init_num: [5, 5, 5, 5, 5]
#  Degeneracy_mitigation: True
#  Degeneracy_Trans_thres: 20
#  Degeneracy_Rot_thres: 20

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8
  CAPACITY: 100000
  CAPACITY_FEATS_MAP: 5000

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: false
  pub_effect_point_en: true
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0
  path_en: true

# Surrounding map
surroundingkeyframeAddingDistThreshold: 10  #1.0   # meters, regulate keyframe adding threshold
surroundingkeyframeAddingAngleThreshold: 0.2  # radians, regulate keyframe adding threshold
surroundingKeyframeDensity: 2.0               # meters, downsample surrounding keyframe poses
surroundingKeyframeSearchRadius: 50.0         # meters, within n meters scan-to-map optimization (when loop closure disabled)

# Visualization
globalMapVisualizationSearchRadius: 1000.0    # meters, global map visualization radius
globalMapVisualizationPoseDensity: 10      # meters, global map visualization keyframe density
globalMapVisualizationLeafSize: 1.0           # meters, global map visualization cloud density

# Loop closure
loopClosureEnableFlag: false
loopClosureFrequency: 4.0                     # Hz, regulate loop closure constraint add frequency
surroundingKeyframeSize: 50                   # submap size (when loop closure enabled)
historyKeyframeSearchRadius: 10             # meters, key frame that is within n meters from current pose will be considerd for loop closure
historyKeyframeSearchTimeDiff: 30.0           # seconds, key frame that is n seconds older will be considered for loop closure
historyKeyframeSearchNum: 20                  # number of hostory key frames will be fused into a submap for loop closure
historyKeyframeFitnessScore: 0.4              # icp threshold, the smaller the better alignment

# GPS Settings
useGpsElevation: true                      # if GPS elevation is bad, set to "false"
gpsCovThreshold: 1                        # m^2, threshold for using GPS data
poseCovThreshold: 10 #25.0                      # m^2, threshold for using GPS data  位姿协方差阈值 from isam2

# voxel filter paprams
mappingSurfLeafSize: 0.4

# recontruct iktree_map
recontructKdTree: false

evo:
  seq_name: "CAMPUS01"
  pose_output_en: false

pcd_save:
  pcd_save_en: true
  filter_size_pcd: 0.3
  interval: -1
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
