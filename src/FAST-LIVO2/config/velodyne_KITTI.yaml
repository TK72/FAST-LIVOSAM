  lid_topic: "/kitti/velo/pointcloud"
  imu_topic: "/kitti/oxts/imu"
#  lid_topic: "/points_raw"
#  imu_topic: "/imu_raw"
  gnss_topic:  "/gps/fix1"
  img_en: 0
  lidar_en: 1
  ros_driver_bug_fix: false
  imuAngularIsDegree: false
  isPengyudata: false

extrin_calib:
    extrinsic_T: [0.810543972031926,-0.307054372250861,0.802723994558354]
    extrinsic_R: [0.999997684917709,-0.000785402787667397,0.00202440580809167,
      0.000755307105485294,0.999889850330232,0.0148245437939419,
      -0.00203582620268315,-0.0148229757986906,0.999888022207966]

    #left camera
    Rcl: [0.00702755500000000,-0.999975300000000,2.59961600000000e-05,
      -0.00225483700000000,-4.18431200000000e-05,-0.999997500000000,
      0.999972800000000,0.00702747900000000,-0.00225507500000000]
    Pcl: [-0.00713774800000000,-0.0748265600000000,-0.333632400000000]

    extrinT_Gnss2Lidar: [0, 0, 0]
    extrinR_Gnss2Lidar: [0,  1, 0,
                         1,  0, 0,
                         0,  0, -1]

time_offset: 
  imu_time_offset: 0.0
  img_time_offset: 0.0
  exposure_time_init: 0.0

preprocess:
  point_filter_num: 5
  filter_size_surf: 0.1
  lidar_type: 2
  scan_line: 64
  blind: 1.5

vio:
  max_iterations: 5
  outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
  img_point_cov: 100 # 100 1000
  patch_size: 8
  patch_pyrimid_level: 4
  normal_en: true
  raycast_en: false
  inverse_composition_en: false
  exposure_estimate_en: false
  inv_expo_cov: 0.1

imu:
  imu_en: false
  imu_int_frame: 10
  acc_cov: 0.1 # 0.2
  gyr_cov: 0.1 # 0.5
  b_acc_cov: 0.0001 # 0.1
  b_gyr_cov: 0.0001 # 0.1

#CAMPUS1
#lio:
#  max_iterations: 5
#  dept_err: 0.02
#  beam_err: 0.02
#  min_eigen_value: 0.5 # 0.005
#  voxel_size: 2.0
#  max_layer: 2
#  max_points_num: 100
#  layer_init_num: [5, 5, 5, 5, 5]

  #CAMPUS2
lio:
  max_iterations: 5
  dept_err: 0.02
  beam_err: 0.02
  min_eigen_value: 0.005 # 0.005
  voxel_size: 1.0
  max_layer: 2
  max_points_num: 80
  layer_init_num: [5, 5, 5, 5, 5]

local_map:  
  map_sliding_en: false
  half_map_size: 100
  sliding_thresh: 8
  CAPACITY: 80000
  CAPACITY_FEATS_MAP: 5000

uav:
  imu_rate_odom: false
  gravity_align_en: false

publish:
  dense_map_en: false
  pub_effect_point_en: true
  pub_plane_en: false
  pub_scan_num: 1
  blind_rgb_points: 0.0
  path_en: true

# Surrounding map
surroundingkeyframeAddingDistThreshold: 10  #1.0   # meters, regulate keyframe adding threshold
surroundingkeyframeAddingAngleThreshold: 0.2  # radians, regulate keyframe adding threshold
surroundingKeyframeDensity: 2.0               # meters, downsample surrounding keyframe poses
surroundingKeyframeSearchRadius: 50.0         # meters, within n meters scan-to-map optimization (when loop closure disabled)

# Visualization
globalMapVisualizationSearchRadius: 1000.0    # meters, global map visualization radius
globalMapVisualizationPoseDensity: 10      # meters, global map visualization keyframe density
globalMapVisualizationLeafSize: 1.0           # meters, global map visualization cloud density

# Loop closure
loopClosureEnableFlag: true
loopClosureFrequency: 2.0                     # Hz, regulate loop closure constraint add frequency
surroundingKeyframeSize: 50                   # submap size (when loop closure enabled)
historyKeyframeSearchRadius: 10             # meters, key frame that is within n meters from current pose will be considerd for loop closure
historyKeyframeSearchTimeDiff: 30.0           # seconds, key frame that is n seconds older will be considered for loop closure
historyKeyframeSearchNum: 20                  # number of hostory key frames will be fused into a submap for loop closure
historyKeyframeFitnessScore: 0.4              # icp threshold, the smaller the better alignment

# GPS Settings
useGpsElevation: true                      # if GPS elevation is bad, set to "false"
gpsCovThreshold: 1                        # m^2, threshold for using GPS data
poseCovThreshold: 10 #25.0                      # m^2, threshold for using GPS data  位姿协方差阈值 from isam2

# voxel filter paprams
mappingSurfLeafSize: 0.4

# recontruct iktree_map
recontructKdTree: false

evo:
  seq_name: "KITTI07"
  pose_output_en: false

pcd_save:
  pcd_save_en: true
  filter_size_pcd: 0.15
  interval: 3
  # how many LiDAR frames saved in each pcd file;
  # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
